name: ${COMPOSE_PROJECT_NAME:-geopanel-dev}

services:
  backend:
    build:
      context: ./backend
      target: dev
    command: sh ./docker/dev-watch.sh
    environment:
      ANALYTICS_METADATA_PATH: /var/lib/geopanel/analytics.json
      API_ADDR: :18080
      API_DB_TIMEOUT: ${API_DB_TIMEOUT:-45s}
      GEOPANEL_DATABASE_URL: ${GEOPANEL_DATABASE_URL:-postgres://backend:${GEOPANEL_DATABASE_PASSWORD:?set GEOPANEL_DATABASE_PASSWORD in .env.dev}@46.8.220.233:8487/backend?sslmode=disable}
      GEOPANEL_DATABASE_ID: ${GEOPANEL_DATABASE_ID:-preprod-backend}
      GEOPANEL_DATABASE_NAME: ${GEOPANEL_DATABASE_NAME:-Preprod backend}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:?set AUTH_OIDC_ISSUER}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:?set AUTH_OIDC_CLIENT_ID}
      AUTH_OIDC_AUDIENCE: ${AUTH_OIDC_AUDIENCE:?set AUTH_OIDC_AUDIENCE}
      AUTH_OIDC_REDIRECT_URL: ${AUTH_OIDC_REDIRECT_URL:?set AUTH_OIDC_REDIRECT_URL}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:?set AUTH_OIDC_CLIENT_SECRET}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${GEOPANEL_DEV_API_PORT:-18081}:18080"
    volumes:
      - analytics_data:/var/lib/geopanel
      - ./backend:/src
      - backend_go_mod:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build

  frontend:
    build:
      context: ./frontend
      target: dev
    command: bun run dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:18080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${GEOPANEL_DEV_HTTP_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  analytics_data:
  backend_go_mod:
  backend_go_build:
  frontend_node_modules:
